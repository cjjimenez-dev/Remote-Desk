# ===================================================================
# RemoteDesk coturn Configuration (Phase 4 Internet Connectivity)
# ===================================================================

# Network & Listening Ports
listening-port=3478
tls-listening-port=5349
alt-tls-listening-port=443

# Relay Port Range (UDP relay ports for relayed WebRTC media & data)
min-port=49152
max-port=65535

# Fingerprint in TURN messages (RFC 5389 requirement for WebRTC)
fingerprint

# Long-term credential mechanism with dynamic HMAC shared secret (RFC 5766)
use-auth-secret
static-auth-secret=RemoteDesk_Turn_Secret_Key_Change_In_Production_2026!
realm=remotedesk.net

# Maximum lifetime of an allocation (in seconds)
max-allocate-timeout=3600

# TLS / TURNS Certificate configuration
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# TLS Security Policies (Disable insecure legacy versions)
no-tlsv1
no-tlsv1_1

# Strong Cipher Suites & Perfect Forward Secrecy
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# DoS and Abuse Mitigation
stale-nonce=600
channel-lifetime=600
permission-lifetime=300

# Logging
log-file=/var/log/coturn/turnserver.log
verbose
no-stdout-log
